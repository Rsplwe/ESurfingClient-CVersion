name: Build Android Binary

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full_version:
        required: true
        type: string
      curl_version:
        required: true
        type: string
      tail_wind_labs_version:
        required: true
        type: string

env:
  NDK_VERSION: r30
  NDK_DIR: android-ndk-r30

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            api: 24
          - abi: armeabi-v7a
            target: armv7a-linux-androideabi
            api: 24
          - abi: x86_64
            target: x86_64-linux-android
            api: 24

    steps:
      - uses: actions/checkout@v7

      - name: 安装软件包 (最多重试 3 次)
        run: |
          PACKAGES="build-essential cmake wget make binutils file unzip"

          sudo apt-get update
          for i in 1 2 3; do
            echo "尝试 $i: 正在安装 $PACKAGES"
            if sudo apt-get install -y $PACKAGES; then
              echo "所有软件包已完成安装"
              break
            fi
            echo "尝试 $i 失败"
            sleep 3
          done

      - name: 获取 Android NDK 缓存
        id: cache-ndk
        uses: actions/cache@v6
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux

      - name: 下载 Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -e
          wget -q https://dl.google.com/android/repository/${NDK_DIR}-linux.zip
          unzip -q ${NDK_DIR}-linux.zip
          rm ${NDK_DIR}-linux.zip
          ls -d ${NDK_DIR}

      - name: 导出 NDK 环境变量
        run: |
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/$NDK_DIR" >> $GITHUB_ENV
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: 获取 libcurl 缓存
        id: cache-curl
        uses: actions/cache@v6
        with:
          path: curl-android-${{ matrix.abi }}
          key: curl-${{ inputs.curl_version }}-android-${{ matrix.abi }}

      - name: 构建 libcurl 静态链接库 (Android ${{ matrix.abi }})
        if: steps.cache-curl.outputs.cache-hit != 'true'
        run: |
          set -e
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC=$TOOLCHAIN/bin/${{ matrix.target }}${{ matrix.api }}-clang
          export CXX=$TOOLCHAIN/bin/${{ matrix.target }}${{ matrix.api }}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$CC
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          wget https://curl.se/download/curl-${{ inputs.curl_version }}.tar.gz
          tar -xzf curl-${{ inputs.curl_version }}.tar.gz
          cd curl-${{ inputs.curl_version }}

          ./configure \
            --prefix=$GITHUB_WORKSPACE/curl-android-${{ matrix.abi }} \
            --host=${{ matrix.target }} \
            --enable-static \
            --disable-shared \
            --without-ssl \
            --enable-http \
            --enable-proxy \
            --enable-cookies \
            --enable-basic-auth \
            --enable-digest-auth \
            --disable-ftp \
            --disable-file \
            --disable-ldap \
            --disable-ldaps \
            --disable-rtsp \
            --disable-dict \
            --disable-telnet \
            --disable-tftp \
            --disable-pop3 \
            --disable-imap \
            --disable-smb \
            --disable-smtp \
            --disable-gopher \
            --disable-mqtt \
            --disable-websockets \
            --disable-bearer-auth \
            --disable-kerberos-auth \
            --disable-negotiate-auth \
            --disable-ntlm \
            --disable-tls-srp \
            --disable-aws \
            --disable-rtmp \
            --without-brotli \
            --without-zstd \
            --without-libpsl \
            --without-libssh2 \
            --without-librtmp \
            --without-libidn2 \
            --without-nghttp2 \
            --without-ngtcp2 \
            --without-nghttp3 \
            --without-quiche \
            --without-msh3 \
            --without-libgsasl \
            --without-libssh \
            --without-wolfssh \
            --without-hyper \
            --without-zlib \
            --disable-ares \
            --disable-rt \
            --disable-threaded-resolver \
            --disable-ipv6 \
            --disable-unix-sockets \
            --disable-manual \
            --disable-docs \
            --disable-verbose \
            --disable-versioned-symbols

          make -j$(nproc)
          make install

      - name: 构建 ESurfingClient 程序 (Android ${{ matrix.abi }})
        run: |
          set -e

          cd esurfingclient/main

          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/curl-android-${{ matrix.abi }} \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_VERBOSE_MAKEFILE=ON

          cmake --build build -j$(nproc)

          cp build/ESurfingClient \
             ../../ESurfingClient-${{ inputs.full_version }}-android-${{ matrix.abi }}

          ls -lh ../../ESurfingClient-${{ inputs.full_version }}-android-${{ matrix.abi }}

      - name: 验证
        run: |
          BIN="ESurfingClient-${{ inputs.full_version }}-android-${{ matrix.abi }}"
          if [ -f "$BIN" ]; then
            echo "✅ 构建成功"
            echo "📏 文件大小: $(du -h "$BIN" | cut -f1)"
            file "$BIN"
          else
            echo "❌ 未找到二进制文件"
            exit 1
          fi

      - name: 获取 web 处理缓存
        id: cache-web
        uses: actions/cache@v6
        with:
          path: tailwindcss-linux-x64
          key: tailwindcss-${{ inputs.tail_wind_labs_version }}-linux-x86_64

      - name: 下载 tailwind_labs 打包程序
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/tailwindlabs/tailwindcss/releases/download/${{ inputs.tail_wind_labs_version }}/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64

      - name: 处理 web 文件
        run: |
          cp -r esurfingclient/main/portal ./
          mkdir -p portal/assets/css

          wget -O portal/assets/js/alpine.js https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js
          wget -O portal/daisyui.mjs https://github.com/saadeghi/daisyui/releases/latest/download/daisyui.mjs

          ./tailwindcss-linux-x64 -i portal/input.css -o portal/assets/css/output.css --minify
          rm portal/input.css
          rm portal/daisyui.mjs

          sed -i 's#https://cdn.jsdelivr.net/npm/daisyui@5#assets/css/output.css#g' portal/index.html
          sed -i 's#<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"##g' portal/index.html
          sed -i 's#rel="stylesheet" type="text/css" />##g' portal/index.html
          sed -i 's#<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>##g' portal/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js#assets/js/alpine.js#g' portal/index.html

      - name: 打包成 tar.gz 压缩包
        run: |
          tar -czf esurfingclient-${{ inputs.full_version }}-android-${{ matrix.abi }}.tar.gz \
            ESurfingClient-${{ inputs.full_version }}-android-${{ matrix.abi }} portal/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: esurfingclient-${{ inputs.full_version }}-android-${{ matrix.abi }}
          path: esurfingclient-${{ inputs.full_version }}-android-${{ matrix.abi }}.tar.gz
          retention-days: 30